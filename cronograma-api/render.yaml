services:
  - type: web
    name: tdb-cronograma-api
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT
    envVars:
      - key: DB_HOST
        value: oracle.fiap.com.br
      - key: DB_PORT
        value: "1521"
      - key: DB_SID
        value: orcl
      - key: DB_USERNAME
        sync: false   # você preenche no painel do Render
      - key: DB_PASSWORD
        sync: false   # você preenche no painel do Render
